name: credential_dumping
kind: credential_dumping
description: >
  LSASS credential dumping: a tool (procdump) opens a handle to lsass.exe and
  reads its memory to harvest credentials. Detect the LSASS memory access
  (Sysmon 10) and the dumper command line (Sysmon 1).
mitre:
  - technique: T1003.001
    name: LSASS Memory
    tactic: Credential Access
params:
  host: WIN-FIN-01
  user: CORP\svc_admin
  dumper_image: C:\Tools\procdump64.exe
  # LSASS memory access -> 100700; dumper command line -> 100701
  expected_rules: [100700, 100701]
