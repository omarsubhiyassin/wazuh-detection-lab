<!--
  Shared agent configuration for the "detection-lab" group. The manager pushes
  this to every enrolled agent (merged into their local ossec.conf), so real
  endpoints collect the right telemetry with no per-host editing — add an agent
  to the group and it starts shipping the sources our rules key on.

  OS-filtered with <agent_config os="...">. Managed by bootstrap.sh; it lands at
  /var/ossec/etc/shared/detection-lab/agent.conf on the manager.
-->
<agent_config os="Windows">
  <!-- Sysmon: process create (1), network (3), process access (10) — the
       events rules 100100/100101/100200/100500/100700 key on. -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <!-- Security channel: 4698 scheduled-task, 1102 log-cleared (100120/100600). -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>

<agent_config os="Linux">
  <!-- Real host auth + syslog (sshd brute-force chain, sudo, etc.). The lab's
       synthetic-generator agent keeps its own bind-mounted localfiles; this
       adds the real files a production Linux endpoint has. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>
  <!-- auditd: execve, privilege change, persistence (see fleet/linux). -->
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>
</agent_config>
