<!--
  Wazuh agent config for the detection lab.
  Tails the synthetic generator output at /var/log/detection-lab (bind-mounted).

  NOTE (Phase 0 scaffold): the <client> enrollment block and log_format choices
  are finalized and verified against the running manager in Phase 1. Formats:
    - Linux sshd/sudo auth.log ..... log_format: syslog
    - Windows Security/Sysmon JSON .. log_format: json
    - Zeek / Suricata eve.json ...... log_format: json
-->
<ossec_config>
  <client>
    <server>
      <address>wazuh.manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>wazuh.manager</manager_address>
      <agent_name>agent-linux-01</agent_name>
      <groups>detection-lab</groups>
    </enrollment>
  </client>

  <!-- Linux auth (sshd, sudo) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/detection-lab/auth.log</location>
  </localfile>

  <!-- Windows Security + Sysmon events emitted as JSON -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/detection-lab/windows_events.json</location>
  </localfile>

  <!-- Network telemetry: Suricata eve.json -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/detection-lab/eve.json</location>
  </localfile>

  <!-- Network telemetry: Zeek conn/dns/http (JSON lines) -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/detection-lab/zeek.json</location>
  </localfile>
</ossec_config>
