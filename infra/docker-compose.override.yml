# Overlay on top of the vendored wazuh-docker single-node compose.
# The bootstrap script copies this file next to the pinned
# infra/wazuh-docker/single-node/docker-compose.yml and runs:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up -d
#
# Everything here is OUR customization; the vendored files stay pristine so the
# pinned Wazuh version can be bumped cleanly. Bind-mount sources use absolute
# host paths via ${DETECTION_LAB_ROOT} (see infra/.env).

services:
  wazuh.manager:
    # Replace the vendored 0.0.0.0 bindings (!override swaps the list instead
    # of merging). Only agent traffic (1514) and enrollment (1515) stay open
    # to the network; syslog + the API are localhost-only until needed.
    ports: !override
      - "1514:1514"
      - "1515:1515"
      - "127.0.0.1:514:514/udp"
      - "127.0.0.1:55000:55000"
    environment:
      # Load our custom rules/decoders on top of the shipped ruleset.
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      # The vendored compose hardcodes SecretPassword; bootstrap rotates the
      # real account to ${INDEXER_PASSWORD} and this keeps filebeat in sync.
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:-SecretPassword}
      # Seeds the API user on a fresh volume; bootstrap rotates existing ones.
      - API_PASSWORD=${API_PASSWORD:-MyS3cr37P450r.*-}
    volumes:
      # Custom detection content (detection-as-code) mounted read-only.
      - ${DETECTION_LAB_ROOT}/detections/rules/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
      - ${DETECTION_LAB_ROOT}/detections/decoders/local_decoder.xml:/var/ossec/etc/decoders/local_decoder.xml:ro

  wazuh.indexer:
    # Only the BFF and local tooling talk to the indexer — never the network.
    ports: !override
      - "127.0.0.1:9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=${INDEXER_JAVA_OPTS:--Xms2g -Xmx2g}"
    volumes:
      # Snapshot repository target (bootstrap adds path.repo + registers it).
      - ${BACKUP_DIR:-/var/tmp/detection-lab-backups}/snapshots:/mnt/snapshots

  wazuh.dashboard:
    ports: !override
      - "127.0.0.1:443:5601"
    environment:
      # Keep the built-in dashboard's clients in sync with the rotated accounts.
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:-SecretPassword}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-kibanaserver}
      - API_PASSWORD=${API_PASSWORD:-MyS3cr37P450r.*-}

  # Custom ATT&CK dashboard (BFF + SPA), run as a stack service so Docker keeps
  # it alive/restarts it — no fragile host process. Reaches the indexer by
  # service name on the compose network; served on localhost:8787 over TLS.
  detection-dashboard:
    build:
      context: ${DETECTION_LAB_ROOT}/dashboard
    image: detection-lab/dashboard:local
    hostname: detection-dashboard
    restart: always
    depends_on:
      - wazuh.indexer
    env_file:
      - ${DETECTION_LAB_ROOT}/dashboard/.env
    environment:
      # Override the host-oriented values in dashboard/.env for in-network use.
      - INDEXER_URL=https://wazuh.indexer:9200
      - DASH_TLS_CERT=/certs/dashboard.pem
      - DASH_TLS_KEY=/certs/dashboard-key.pem
      - PORT=8787
      # RBAC users + triage/audit state live in a bind-mounted dir so they
      # survive container recreation (a dir mount is safe if the host path is new).
      - DASH_USERS_FILE=/app/state/users.json
      - DASH_TRIAGE_FILE=/app/state/triage-state.json
      - DASH_AUDIT_FILE=/app/state/audit.log
      - DASH_FINDINGS_FILE=/app/state/ai-findings.json
      # Read-only view of the ruleset so the dashboard can show which ATT&CK
      # techniques we actually have detections for, separately from which ones
      # produced alerts.
      - DASH_RULES_FILE=/app/rules/local_rules.xml
    volumes:
      - ${DETECTION_LAB_ROOT}/dashboard/certs:/certs:ro
      - ${DETECTION_LAB_ROOT}/dashboard/state:/app/state
      # Same file the manager loads, mounted read-only. Re-read on mtime change,
      # so deploy-rules.sh updates coverage without a dashboard restart.
      - ${DETECTION_LAB_ROOT}/detections/rules/local_rules.xml:/app/rules/local_rules.xml:ro
    ports:
      - "127.0.0.1:8787:8787"

  # Linux endpoint that tails the synthetic log generator's output.
  # Enrollment + localfile wiring are finished and verified in Phase 1.
  wazuh.agent.linux:
    image: wazuh/wazuh-agent:${WAZUH_IMAGE_TAG:-4.14.6}
    hostname: agent-linux-01
    restart: always
    depends_on:
      - wazuh.manager
    environment:
      - WAZUH_MANAGER=${WAZUH_MANAGER_HOST:-wazuh.manager}
      - WAZUH_AGENT_NAME=agent-linux-01
      - WAZUH_AGENT_GROUP=detection-lab
      # Authenticated enrollment: the image writes this to authd.pass only when
      # non-empty, so leaving it unset keeps open enrollment (lab mode).
      - WAZUH_REGISTRATION_PASSWORD=${AGENT_ENROLLMENT_PASSWORD:-}
    volumes:
      # Generator output the agent will tail (read-only). Keep on the WSL
      # filesystem so inotify fires — see infra/README.md.
      - ${DETECTION_LAB_ROOT}/generator/output:/var/log/detection-lab:ro
      # Custom agent config wiring the localfile inputs (fleshed out in Phase 1).
      - ${DETECTION_LAB_ROOT}/infra/config/agent-ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
