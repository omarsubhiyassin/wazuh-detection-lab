# Overlay on top of the vendored wazuh-docker single-node compose.
# The bootstrap script copies this file next to the pinned
# infra/wazuh-docker/single-node/docker-compose.yml and runs:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up -d
#
# Everything here is OUR customization; the vendored files stay pristine so the
# pinned Wazuh version can be bumped cleanly. Bind-mount sources use absolute
# host paths via ${DETECTION_LAB_ROOT} (see infra/.env).

services:
  wazuh.manager:
    environment:
      # Load our custom rules/decoders on top of the shipped ruleset.
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      # The vendored compose hardcodes SecretPassword; bootstrap rotates the
      # real account to ${INDEXER_PASSWORD} and this keeps filebeat in sync.
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:-SecretPassword}
      # Seeds the API user on a fresh volume; bootstrap rotates existing ones.
      - API_PASSWORD=${API_PASSWORD:-MyS3cr37P450r.*-}
    volumes:
      # Custom detection content (detection-as-code) mounted read-only.
      - ${DETECTION_LAB_ROOT}/detections/rules/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
      - ${DETECTION_LAB_ROOT}/detections/decoders/local_decoder.xml:/var/ossec/etc/decoders/local_decoder.xml:ro

  wazuh.indexer:
    environment:
      - "OPENSEARCH_JAVA_OPTS=${INDEXER_JAVA_OPTS:--Xms2g -Xmx2g}"

  wazuh.dashboard:
    environment:
      # Keep the built-in dashboard's clients in sync with the rotated accounts.
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:-SecretPassword}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-kibanaserver}
      - API_PASSWORD=${API_PASSWORD:-MyS3cr37P450r.*-}

  # Linux endpoint that tails the synthetic log generator's output.
  # Enrollment + localfile wiring are finished and verified in Phase 1.
  wazuh.agent.linux:
    image: wazuh/wazuh-agent:${WAZUH_IMAGE_TAG:-4.14.6}
    hostname: agent-linux-01
    restart: always
    depends_on:
      - wazuh.manager
    environment:
      - WAZUH_MANAGER=${WAZUH_MANAGER_HOST:-wazuh.manager}
      - WAZUH_AGENT_NAME=agent-linux-01
      - WAZUH_AGENT_GROUP=detection-lab
      # Authenticated enrollment: the image writes this to authd.pass only when
      # non-empty, so leaving it unset keeps open enrollment (lab mode).
      - WAZUH_REGISTRATION_PASSWORD=${AGENT_ENROLLMENT_PASSWORD:-}
    volumes:
      # Generator output the agent will tail (read-only). Keep on the WSL
      # filesystem so inotify fires — see infra/README.md.
      - ${DETECTION_LAB_ROOT}/generator/output:/var/log/detection-lab:ro
      # Custom agent config wiring the localfile inputs (fleshed out in Phase 1).
      - ${DETECTION_LAB_ROOT}/infra/config/agent-ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
